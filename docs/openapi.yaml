openapi: 3.0.3
info:
  title: Master Data Service API
  version: 0.1.0-draft
  description: |
    Master data for Serene Travels tour management: reference lookups, structural aggregates
    (properties, attractions, restaurants, packages), operational data (vehicles, drivers, guides,
    promotions) and a single versioned **rate engine** shared by all ten price tables.

    Design rationale and rules (rate semantics, delete behaviour, auth matrix) live in `API-DESIGN.md`.

    Conventions: integer ids; FKs read as `Ref` objects and written as plain ids; lists are Spring pages
    (`sort=name,asc`, repeatable); errors are RFC 7807 `application/problem+json`; `createdBy` comes from the JWT.
servers:
  - url: http://localhost:8080/master-data-service/api/v1/master-data
    description: Through cloud-gateway
  - url: http://localhost:8082/api/v1/master-data
    description: Direct (local)
security:
  - bearerAuth: []
tags:
  - name: Lookups
    description: Cold reference data. Fetch once, cache.
  - name: Properties
  - name: Attractions
  - name: Restaurants
  - name: Packages
  - name: Vehicles
  - name: Drivers
  - name: Guides
  - name: Promotions
  - name: Distances & Articles
  - name: Rates
    description: One engine for all price tables. ADMIN or MANAGER only; the quotation service account may call resolve.
  - name: Operations
    description: Alerts, import and export.

paths:
  # ---------------------------------------------------------------- lookups
  /lookups:
    get:
      tags: [Lookups]
      operationId: getLookups
      summary: All reference lookups in one response (bootstrap for dropdowns)
      description: Returns an ETag and Cache-Control no-cache. Send If-None-Match to revalidate; unchanged data gives a 304.
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Bundle of all lookups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupBundle' }
        '304': { description: Not modified }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /lookups/{name}:
    parameters:
      - $ref: '#/components/parameters/LookupName'
    get:
      tags: [Lookups]
      operationId: listLookup
      summary: One lookup list
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LookupItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Lookups]
      operationId: createLookupItem
      summary: Add a lookup item (ADMIN, MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LookupItemInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lookups/{name}/{id}:
    parameters:
      - $ref: '#/components/parameters/LookupName'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Lookups]
      operationId: updateLookupItem
      summary: Edit a lookup item (ADMIN, MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LookupItemInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Lookups]
      operationId: deleteLookupItem
      summary: Delete a lookup item (409 IN_USE if referenced). technical-visit-categories is soft-deleted (active=false) instead.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- properties
  /properties:
    get:
      tags: [Properties]
      operationId: listProperties
      summary: List properties (summary rows)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/DestinationId'
        - $ref: '#/components/parameters/Active'
        - { name: starRating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - $ref: '#/components/parameters/At'
      responses:
        '200':
          description: Page of properties
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Properties]
      operationId: createProperty
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyInput' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /properties/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Properties]
      operationId: getProperty
      summary: Full property aggregate
      parameters:
        - { name: include, in: query, description: 'Optional heavy parts', schema: { type: array, items: { type: string, enum: [rates] } }, style: form, explode: false }
        - $ref: '#/components/parameters/At'
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Properties]
      operationId: updateProperty
      summary: Quick edit - send only changed fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Properties]
      operationId: deactivateProperty
      summary: Soft delete (active=false)
      responses:
        '204': { description: Deactivated }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/room-types:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Properties]
      operationId: addRoomType
      summary: Add a room type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomTypeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /room-types/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Properties]
      operationId: updateRoomType
      summary: Edit a room type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomTypeInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Properties]
      operationId: deleteRoomType
      summary: Delete a room type (409 IN_USE if rates reference it)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /properties/{id}/child-rules:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Properties]
      operationId: replaceChildRules
      summary: Replace the full set of child rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ChildRuleInput' }
      responses:
        '200':
          description: New set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChildRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/inclusions:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Properties]
      operationId: replacePropertyInclusions
      summary: Replace the full set of inclusions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PropertyInclusionInput' }
      responses:
        '200':
          description: New set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PropertyInclusion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/dietary:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Properties]
      operationId: replacePropertyDietary
      summary: Replace dietary support for the property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/DietarySupportInput' }
      responses:
        '200':
          description: New set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DietarySupport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/baby-cot:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Properties]
      operationId: setBabyCot
      summary: Set baby cot availability and cost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BabyCot' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BabyCot' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/rates:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Properties, Rates]
      operationId: saveRateGrid
      summary: Save the room type x season x nationality x occupancy grid atomically
      description: Each item is applied with the same rules as PUT /rates/property; the whole request is all-or-nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RateWrite' }
      responses:
        '200':
          description: Resulting current rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RateRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- attractions
  /attractions:
    get:
      tags: [Attractions]
      operationId: listAttractions
      summary: List attractions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/DestinationId'
        - { name: isSafari, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/At'
      responses:
        '200':
          description: Page of attractions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttractionPage' }
    post:
      tags: [Attractions]
      operationId: createAttraction
      summary: Create an attraction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttractionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attraction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attractions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Attractions]
      operationId: getAttraction
      summary: Attraction with current rates and tuk-tuk fare
      parameters:
        - $ref: '#/components/parameters/At'
      responses:
        '200':
          description: Attraction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attraction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Attractions]
      operationId: updateAttraction
      summary: Quick edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttractionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attraction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Attractions]
      operationId: deleteAttraction
      summary: Delete (409 IN_USE if referenced)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- restaurants
  /restaurants:
    get:
      tags: [Restaurants]
      operationId: listRestaurants
      summary: List restaurants
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/DestinationId'
      responses:
        '200':
          description: Page of restaurants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantPage' }
    post:
      tags: [Restaurants]
      operationId: createRestaurant
      summary: Create a restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Restaurants]
      operationId: getRestaurant
      summary: Restaurant with closed days and dietary support
      responses:
        '200':
          description: Restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Restaurants]
      operationId: updateRestaurant
      summary: Quick edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestaurantInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Restaurants]
      operationId: deleteRestaurant
      summary: Delete
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /restaurants/{id}/closed-days:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Restaurants]
      operationId: replaceRestaurantClosedDays
      summary: Replace closed days (ISO weekday 1=Mon..7=Sun)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, minimum: 1, maximum: 7 }
      responses:
        '200':
          description: New set
          content:
            application/json:
              schema:
                type: array
                items: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /restaurants/{id}/dietary:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Restaurants]
      operationId: replaceRestaurantDietary
      summary: Replace dietary categories the restaurant supports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, description: dietary_category id }
      responses:
        '200':
          description: New set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ref' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- packages
  /packages:
    get:
      tags: [Packages]
      operationId: listPackages
      summary: List site tour packages
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/At'
      responses:
        '200':
          description: Page of packages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackagePage' }
    post:
      tags: [Packages]
      operationId: createPackage
      summary: Create a package
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /packages/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Packages]
      operationId: getPackage
      summary: Package with sites and current rate
      parameters:
        - $ref: '#/components/parameters/At'
      responses:
        '200':
          description: Package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Packages]
      operationId: updatePackage
      summary: Quick edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackageInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Packages]
      operationId: deletePackage
      summary: Delete
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /packages/{id}/sites:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Packages]
      operationId: replacePackageSites
      summary: Replace the attractions included in the package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, description: attraction id }
      responses:
        '200':
          description: New set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ref' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- vehicles / drivers / guides
  /vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: List vehicles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Active'
        - { name: vehicleTypeId, in: query, schema: { type: integer } }
        - { name: expiringWithinDays, in: query, description: 'Insurance or revenue licence expires within N days', schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Page of vehicles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehiclePage' }
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: Vehicle with type, driver, assistant and expiry warnings
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vehicles]
      operationId: updateVehicle
      summary: Quick edit (e.g. renew insurance expiry, change driver)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Vehicles]
      operationId: deactivateVehicle
      summary: Soft delete (active=false)
      responses:
        '204': { description: Deactivated }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers:
    get:
      tags: [Drivers]
      operationId: listDrivers
      summary: List drivers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Active'
        - { name: isChauffeur, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Page of drivers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPage' }
    post:
      tags: [Drivers]
      operationId: createDriver
      summary: Create a driver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /drivers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Drivers]
      operationId: getDriver
      summary: Get a driver
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Drivers]
      operationId: updateDriver
      summary: Quick edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Drivers]
      operationId: deactivateDriver
      summary: Soft delete (active=false)
      responses:
        '204': { description: Deactivated }
        '404': { $ref: '#/components/responses/NotFound' }
  /guides:
    get:
      tags: [Guides]
      operationId: listGuides
      summary: List guides
      parameters:
